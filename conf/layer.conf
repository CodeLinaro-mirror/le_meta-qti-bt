#BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-products/images/*.bbappend"
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " ${LAYERDIR}/recipes/*/*.bb\
			${LAYERDIR}/recipes-*/*/*.bb "

BBFILE_COLLECTIONS += "bt"
BBFILE_PRIORITY_bt = "12"
BBFILE_PATTERN_bt := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_bt = "dunfell kirkstone"

