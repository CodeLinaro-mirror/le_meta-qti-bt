<!-- This configuration file specifies the required security policies
     for Audio Manager to send DBus Commands for source selection. -->

<busconfig>
  <!-- ../system.conf have denied everything, so we just punch some holes -->
  <policy user="root">
    <allow own="com.qualcomm.qti.adk.btipc.daemon" />
    <allow own="com.qualcomm.qti.adk.btipc.daemon.sender" />
    <allow own="com.qualcomm.qti.adk.btipc.daemon.hfpag.sender" />
    <allow send_destination="com.qualcomm.qti.adk.btipc.daemon" />
    <allow send_interface="com.qualcomm.qti.adk.btipc.daemon.gatt" />
    <allow send_interface="com.qualcomm.qti.adk.btipc.daemon.hfpag" />	

    <allow own="com.qualcomm.qti.adk.btipc.app" />
    <allow own="com.qualcomm.qti.adk.btipc.app.sender" />
    <allow own="com.qualcomm.qti.adk.btipc.app.hfpag.sender" />
    <allow send_destination="com.qualcomm.qti.adk.btipc.app" />
    <allow send_interface="com.qualcomm.qti.adk.btipc.app.gatt" />
    <allow send_interface="com.qualcomm.qti.adk.btipc.app.hfpag" />
  </policy>
</busconfig>

